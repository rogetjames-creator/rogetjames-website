# Catch-all — MUST stay last. Any other old/stale URL that isn't a real file
# and isn't matched by a rule above 301s to the homepage instead of hitting
# Netlify's default 404. Real files (assets, images, the .html pages) are
# served first, so this only ever fires for paths that would otherwise 404.
[[redirects]]
  from = "/*"
  to = "/"
  status = 301

# Security headers — applied to every route. The CSP allows only the sources
# the site actually uses (self, Google Fonts, the myportfolio image CDN); there
# are no iframes, workers or eval in the site, so this does not break anything.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://use.typekit.net; font-src 'self' https://fonts.gstatic.com https://use.typekit.net https://p.typekit.net data:; img-src 'self' data: https://cdn.myportfolio.com; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'"

# Cache immutable hashed assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images: always revalidate so a /media replace-in-place shows on the next page
# load instead of being stuck behind a long cache. The browser keeps a copy but
# checks it against the server on every load (a cheap 304 when unchanged; the
# new bytes the moment an image is replaced). This is what makes replacements
# instant for everyone, not just new visitors.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache videos for 30 days
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Cache fonts for 1 year
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — short cache, always revalidate
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Allow the Netlify Image CDN to fetch + resize Airtable-hosted attachment images
# (used by the client Vault). Serving them through /.netlify/images makes them
# same-origin (so the strict CSP allows them) and lets us cap their resolution.
[images]
  remote_images = ["https://[^/]*\\.airtableusercontent\\.com/.*", "https://dl\\.airtable\\.com/.*"]
