/* ---- lifted verbatim from src/components/Hero.jsx ---- */
const WORD_FILL     = "rgba(237,234,227,0.88)";
const SYMBOL_FILL   = "rgba(237,232,223,0.44)";
const SYMBOL_FILTER = "drop-shadow(0 -2.5px 1.5px rgba(255,253,248,0.5)) drop-shadow(0 3px 2px rgba(0,0,0,0.65))";
const CAST_SHADOW   = "drop-shadow(0 42px 8px rgba(0,0,0,0.7))";

const POSITIONS = {
  aboveR: { baseline: 449.17, align: "right", anchor: 299.7 },  // upper-left  — original left word
  belowT: { baseline: 700.39, align: "left",  anchor: 802.5 },  // lower-right — original right word
  aboveT: { baseline: 585,    align: "left",  anchor: 802.5 },  // upper-right — above the T crossbar
  belowR: { baseline: 585,    align: "right", anchor: 299.7 },  // lower-left  — below the R arm (spare)
};
const SEQUENCE = [
  ["MEETS", "DESIGN", "aboveT", "belowT"],  // opener: MEETS above the T, DESIGN below it
  ["METAL", "FORMS"],
  ["IDEAS", "FORMED"],
  ["",      "INSPIRED"],    // "ART inspired" — no left word, empty clears that slot
  ["ORIGINAL", "CREATIONS"], // upper-left / lower-right, the default slots
];

const LEFT_ID  = "hero-meets";
const RIGHT_ID = "hero-design";
const leftSlot  = (e) => ({ id: LEFT_ID,  ...POSITIONS[e[2] || "aboveR"] });
const rightSlot = (e) => ({ id: RIGHT_ID, ...POSITIONS[e[3] || "belowT"] });

const FLIP_EVERY       = 6;
const FLIP_STAGGER     = 0.07;
const FLIP_DOWN        = 0.16;
const FLIP_UP          = 0.2;
const FLIP_START_DELAY = 9.5;

function cellsFor(slot, key) {
  const w = WORDS[key];
  if (!w) return [];
  const left = slot.align === "right" ? slot.anchor - w.width : slot.anchor;
  return w.glyphs.map((g) => ({ d: g.d, x: left + g.x }));
}
const MEETS_CELLS  = Math.max(...SEQUENCE.map(([l]) => (WORDS[l]?.glyphs.length) || 0));
const DESIGN_CELLS = Math.max(...SEQUENCE.map(([, r]) => (WORDS[r]?.glyphs.length) || 0));

/* build the letter cells, the same markup the React component renders */
document.getElementById("shadowed").style.filter = CAST_SHADOW;
const sym = document.getElementById("hero-art-symbol");
sym.style.fill = SYMBOL_FILL; sym.style.filter = SYMBOL_FILTER; sym.style.opacity = 0;
for (const [id, n, slotOf, wordAt] of [
  [LEFT_ID,  MEETS_CELLS,  leftSlot,  0],
  [RIGHT_ID, DESIGN_CELLS, rightSlot, 1],
]) {
  const host = document.getElementById(id);
  host.style.fill = WORD_FILL; host.style.opacity = 0;
  const slot = slotOf(SEQUENCE[0]);
  const cells = cellsFor(slot, SEQUENCE[0][wordAt]);
  for (let i = 0; i < n; i++) {
    const c = cells[i];
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "flip-cell");
    g.dataset.x = c ? c.x : 0;
    g.setAttribute("transform", `translate(${c ? c.x : 0} ${slot.baseline}) scale(1 1)`);
    if (!c) g.style.opacity = 0;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", c ? c.d : "");
    g.appendChild(p); host.appendChild(g);
  }
}

/* ---- the flip, verbatim ---- */
const flipSlot = (slot, key) => {
  const host = document.getElementById(slot.id);
  const cells = [...host.querySelectorAll(".flip-cell")];
  const next = cellsFor(slot, key);
  cells.forEach((cell, i) => {
    const path = cell.querySelector("path");
    const target = next[i];
    const st = { sy: 1, x: parseFloat(cell.dataset.x || "0") };
    const write = () => cell.setAttribute(
      "transform", `translate(${st.x} ${slot.baseline}) scale(1 ${st.sy})`);
    gsap.timeline({ delay: i * FLIP_STAGGER })
      .to(st, { sy: 0, duration: FLIP_DOWN, ease: "power2.in", onUpdate: write })
      .to(cell, { opacity: 0.55, duration: 0.01 }, "<0.14")
      .add(() => {
        path.setAttribute("d", target ? target.d : "");
        if (target) { st.x = target.x; cell.dataset.x = target.x; }
        write();
      })
      .to(st, { sy: target ? 1 : 0, duration: FLIP_UP, ease: "power2.out", onUpdate: write })
      .to(cell, { opacity: target ? 1 : 0, duration: FLIP_UP * 0.6 }, "<");
  });
};

const setSlot = (slot, key) => {
  const host = document.getElementById(slot.id);
  const cells = [...host.querySelectorAll(".flip-cell")];
  const next = cellsFor(slot, key);
  cells.forEach((cell, i) => {
    const t = next[i];
    cell.querySelector("path").setAttribute("d", t ? t.d : "");
    if (t) cell.dataset.x = t.x;
    cell.setAttribute("transform", `translate(${t ? t.x : 0} ${slot.baseline}) scale(1 1)`);
    cell.style.opacity = t ? 1 : 0;
  });
};

const flyInOpening = () => {
  const entry = SEQUENCE[0];
  const [l, r] = entry;
  gsap.timeline()
    .to(["#hero-meets", "#hero-design"], { opacity: 0, duration: 0.5, ease: "power2.in" })
    .add(() => { setSlot(leftSlot(entry), l); setSlot(rightSlot(entry), r); })
    .set("#hero-meets",  { x: -150 })
    .set("#hero-design", { x: 150, y: 90 })
    .to("#hero-meets",  { opacity: 1, x: 0,       duration: 1.5, ease: "power3.out" })
    .to("#hero-design", { opacity: 1, x: 0, y: 0, duration: 1.5, ease: "power3.out" });
};

/* ---- the entrance, verbatim ---- */
gsap.set("#hero-art-symbol", { opacity: 0 });
gsap.set("#hero-meets",  { opacity: 0, x: -150 });
gsap.set("#hero-design", { opacity: 0, x: 150, y: 90 });
const tl = gsap.timeline();
tl.to("#hero-art-symbol", { opacity: 1, duration: 4.2, ease: "sine.out" }, 0.6);
tl.to("#hero-meets",  { opacity: 1, x: 0,       duration: 1.5, ease: "power3.out" }, 3.9);
tl.to("#hero-design", { opacity: 1, x: 0, y: 0, duration: 1.5, ease: "power3.out" }, 5.4);

const at = { i: 0 };
setTimeout(() => setInterval(() => {
  at.i = (at.i + 1) % SEQUENCE.length;
  if (at.i === 0) { flyInOpening(); return; }
  const entry = SEQUENCE[at.i];
  flipSlot(leftSlot(entry),  entry[0]);
  flipSlot(rightSlot(entry), entry[1]);
}, FLIP_EVERY * 1000), FLIP_START_DELAY * 1000);
</script>
</body>
</html>
