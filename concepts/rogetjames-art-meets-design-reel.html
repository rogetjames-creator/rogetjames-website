/* ------------------------------------------------------------------
   4. The engine.
------------------------------------------------------------------- */
const ease = {
  outQuart: t => 1 - Math.pow(1 - t, 4),
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic:  t => t * t * t,
  outSine:  t => Math.sin(t * Math.PI / 2),
};

let clock = 0, rate = 1, lastFrame = null, tweens = [], calls = [];
const at    = (t, fn)                => calls.push({ t, fn, done:false });
const tween = (start, dur, e, apply) => tweens.push({ start, dur, e, apply, done:false });

function frame(now) {
  if (lastFrame === null) lastFrame = now;
  clock += ((now - lastFrame) / 1000) * rate;
  lastFrame = now;
  for (const c of calls)  if (!c.done && clock >= c.t) { c.done = true; c.fn(); }
  for (const w of tweens) {
    if (w.done) continue;
    const p = (clock - w.start) / w.dur;
    if (p < 0) continue;
    if (p >= 1) { w.apply(1); w.done = true; } else w.apply(w.e(p));
  }
  if (tweens.length > 600) tweens = tweens.filter(w => !w.done);
  if (calls.length  > 600) calls  = calls.filter(c => !c.done);
  requestAnimationFrame(frame);
}

const svg      = document.getElementById('mark');
const shadowed = document.getElementById('shadowed');
const symbol   = document.getElementById('symbol');
const groups   = { meets:  document.getElementById('slot-meets'),
                   design: document.getElementById('slot-design') };

shadowed.style.filter = CFG.castShadow;
symbol.setAttribute('d', ART.symbol);
symbol.style.fill   = CFG.symbolFill;
symbol.style.filter = CFG.symbolBevel;

// one flip cell per letter of the longest word that ever appears in each slot
const cells = { meets: [], design: [] };
for (const key of ['meets','design']) {
  const idx  = key === 'meets' ? 0 : 1;
  const most = Math.max.apply(null, SEQUENCE.map(function (p) {
    var w = ART.words[p[idx]];
    return w ? w.glyphs.length : 0;
  }));
  groups[key].style.fill = CFG.wordFill;
  for (let i = 0; i < most; i++) {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.appendChild(document.createElementNS('http://www.w3.org/2000/svg','path'));
    groups[key].appendChild(g);
    cells[key].push(g);
  }
}

// the left slot is right-aligned, the right slot left-aligned, so both words
// always grow OUTWARD from the ART symbol
function letters(slotKey, word) {
  const s = CFG.slots[slotKey], w = ART.words[word];
  if (!w) { console.warn('unknown word:', word); return []; }
  const left = s.align === 'right' ? s.anchor - w.width : s.anchor;
  return w.glyphs.map(g => ({ d:g.d, x:left + g.x }));
}

// glyphs are normalised so the baseline sits at y=0 — scale(1,sy) therefore
// collapses a letter straight down onto its line and back up, never sideways
const place = (cell, x, baseline, sy) =>
  cell.setAttribute('transform', 'translate(' + x + ' ' + baseline + ') scale(1 ' + sy + ')');

function setWord(slotKey, word) {
  const s = CFG.slots[slotKey], ls = letters(slotKey, word);
  cells[slotKey].forEach((cell, i) => {
    const t = ls[i];
    cell.firstChild.setAttribute('d', t ? t.d : '');
    cell.dataset.x = t ? t.x : 0;
    cell.style.opacity = t ? 1 : 0;
    place(cell, t ? t.x : 0, s.baseline, 1);
  });
}

function setGroup(slotKey, o) {
  const x = o.x || 0, y = o.y || 0;
  groups[slotKey].setAttribute('transform', 'translate(' + x + ' ' + y + ')');
  if (o.opacity !== undefined) groups[slotKey].style.opacity = o.opacity;
}

function flipTo(slotKey, word, startAt) {
  const s = CFG.slots[slotKey], ls = letters(slotKey, word);
  cells[slotKey].forEach((cell, i) => {
    const target = ls[i];
    const begin  = startAt + i * CFG.letterStagger;
    const x0     = parseFloat(cell.dataset.x || 0);
    tween(begin, CFG.flipShut, ease.inCubic, p => {
      place(cell, x0, s.baseline, 1 - p);
      if (p > 0.85) cell.style.opacity = 0.55;     // flap catches shadow mid-turn
    });
    at(begin + CFG.flipShut, () => {               // glyph swapped while shut
      cell.firstChild.setAttribute('d', target ? target.d : '');
      cell.dataset.x = target ? target.x : x0;
      place(cell, target ? target.x : x0, s.baseline, 0);
    });
    tween(begin + CFG.flipShut, CFG.flipOpen, ease.outCubic, p => {
      place(cell, parseFloat(cell.dataset.x || 0), s.baseline, target ? p : 0);
      cell.style.opacity = target ? 0.55 + 0.45 * p : 0;
    });
  });
}

// MEETS then DESIGN fly in, one after the other. Returns when DESIGN lands.
function flyInOpening(startAt) {
  const l = SEQUENCE[0][0], r = SEQUENCE[0][1];
  const gap = CFG.designFlyAt - CFG.meetsFlyAt;
  at(startAt, () => { setWord('meets', l); setWord('design', r); });
  const m = CFG.slots.meets.flyFrom, d = CFG.slots.design.flyFrom;
  tween(startAt, CFG.meetsFlyDur, ease.outQuart,
        p => setGroup('meets', { x:m.x * (1-p), y:0, opacity:p }));
  tween(startAt + gap, CFG.designFlyDur, ease.outQuart,
        p => setGroup('design', { x:d.x * (1-p), y:d.y * (1-p), opacity:p }));
  return startAt + gap + CFG.designFlyDur;
}

// one pass of the board, then the reset, then it schedules itself again
function runBoard(startAt) {
  let t = startAt;
  for (let i = 1; i < SEQUENCE.length; i++) {
    flipTo('meets',  SEQUENCE[i][0], t);
    flipTo('design', SEQUENCE[i][1], t);
    t += CFG.changeEvery;
  }
  tween(t, CFG.resetFade, ease.inCubic, p => {
    groups.meets.style.opacity  = 1 - p;
    groups.design.style.opacity = 1 - p;
  });
  const landed = flyInOpening(t + CFG.resetFade);
  // let the signature line hold before the board starts turning again
  at(landed + CFG.changeEvery, () => runBoard(landed + CFG.changeEvery));
}

function start() {
  tweens = []; calls = []; clock = 0;
  symbol.style.opacity = 0;
  setWord('meets',  SEQUENCE[0][0]);
  setWord('design', SEQUENCE[0][1]);
  setGroup('meets',  { x:CFG.slots.meets.flyFrom.x,  y:0, opacity:0 });
  setGroup('design', { x:CFG.slots.design.flyFrom.x, y:CFG.slots.design.flyFrom.y, opacity:0 });
  tween(CFG.symbolFadeAt, CFG.symbolFadeDur, ease.outSine, p => { symbol.style.opacity = p; });
  flyInOpening(CFG.meetsFlyAt);
  runBoard(CFG.boardStartsAt);
}

/* ---------- controls ---------- */
const ui = document.getElementById('ui');
document.getElementById('replay').onclick = start;
document.getElementById('bg').onclick = function () {
  const b = document.body;
  const cur = b.style.getPropertyValue('--bg') || '#0b0b0b';
  if (b.classList.contains('transparent')) { b.classList.remove('transparent'); b.style.setProperty('--bg','#0b0b0b'); }
  else if (cur === '#0b0b0b') b.style.setProperty('--bg','#f2f0e9');
  else b.classList.add('transparent');
};
const rateBtn = document.getElementById('rate');
rateBtn.onclick = function () {
  rate = rate === 1 ? 0.5 : rate === 0.5 ? 2 : 1;
  rateBtn.innerHTML = rate + '&times;';
};
addEventListener('keydown', function (e) {
  const k = e.key.toLowerCase();
  if (k === 'r') start();
  if (k === 'b') document.getElementById('bg').click();
  if (k === 'h') ui.classList.toggle('hidden');
});
if (new URLSearchParams(location.search).has('bare')) ui.classList.add('hidden');

start();
requestAnimationFrame(frame);
</script>
