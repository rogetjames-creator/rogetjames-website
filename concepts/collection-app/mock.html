<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collection mock</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0d0c;--panel:#161412;--card:#1c1a17;--line:rgba(237,232,223,.10);--text:#EDE8DF;--dim:rgba(237,232,223,.62);--gold:#c08c46;--map:#22201c;--road:#34312b;--chip:rgba(237,232,223,.07)}
body.light{--bg:#f4f2ee;--panel:#fbfaf8;--card:#ffffff;--line:rgba(20,18,15,.09);--text:#1b1916;--dim:rgba(27,25,22,.58);--gold:#9E7134;--map:#e9e6df;--road:#fff;--chip:rgba(20,18,15,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:100%;object-fit:cover}
.title{font-weight:800;letter-spacing:-.01em}
.dim{color:var(--dim)}
.search{display:flex;align-items:center;gap:10px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--dim);font-size:14px}
.seg{display:flex;gap:6px}
.seg span{font-size:13px;padding:7px 14px;border-radius:999px;color:var(--dim);border:1px solid var(--line)}
.seg span.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
/* tiles */
.masonry{columns:2;column-gap:10px}
.tile{break-inside:avoid;margin:0 0 10px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);position:relative}
.tile .pic{overflow:hidden}
.tile .meta{padding:9px 11px 11px}
.tile .t{font-size:13px;font-weight:600;line-height:1.3}
.tile .s{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;align-items:center;gap:6px}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;letter-spacing:.06em;padding:4px 8px;border-radius:999px;backdrop-filter:blur(6px);display:flex;gap:5px;align-items:center}
.note{padding:14px 14px 16px;font-family:'Jost',sans-serif;font-size:15px;line-height:1.45}
.note .s{margin-top:10px}
.map{position:relative;height:120px;background:var(--map);overflow:hidden}
.map i{position:absolute;background:var(--road)}
.pin{position:absolute;left:50%;top:46%;width:22px;height:22px;margin:-22px 0 0 -11px;background:var(--gold);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.pin:after{content:"";position:absolute;inset:7px;background:var(--card);border-radius:50%}
.fav{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--gold)}
.fab{position:absolute;right:20px;bottom:34px;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#fff;font-size:30px;font-weight:300;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
/* phone */
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg)}
.status{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-size:15px;font-weight:600}
.ph-head{padding:12px 18px 10px}
.ph-head .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ph-head .title{font-size:30px}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim)}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 18px 120px}
.board .cover{height:150px;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--line)}
.board .cover div:first-child{grid-row:1/3}
.board .n{font-size:14px;font-weight:700;margin-top:8px}
.board .c{font-size:12px;color:var(--dim);margin-top:2px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:12px;font-size:11px;color:var(--dim)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:5px}
.tabbar b{width:22px;height:22px;border-radius:6px;border:1.6px solid currentColor;display:block}
.tabbar .on{color:var(--text)}
.bhead{padding:8px 18px 12px}
.back{font-size:14px;color:var(--gold);margin-bottom:8px}
.bhead .title{font-size:26px}
.bhead .row2{display:flex;gap:8px;margin-top:12px;overflow:hidden}
.pane{padding:0 12px}
/* desktop */
.desk{width:1440px;height:900px;display:grid;grid-template-columns:250px 1fr;background:var(--bg)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:26px 18px}
.side .title{font-size:22px;margin:0 8px 22px}
.side .lab{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:22px 8px 8px}
.side .it{display:flex;align-items:center;gap:11px;padding:8px;border-radius:10px;font-size:14px}
.side .it.on{background:var(--chip);font-weight:600}
.side .it img{width:30px;height:30px;border-radius:7px}
.side .it .k{margin-left:auto;font-size:12px;color:var(--dim)}
.main{padding:24px 34px;overflow:hidden}
.mtop{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.mtop .search{flex:1;max-width:520px}
.btn{background:var(--gold);color:#fff;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600}
.mtitle{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.mtitle .title{font-size:32px}
.desk .masonry{columns:5;column-gap:14px}
.desk .tile{margin-bottom:14px}
</style></head>
<body>
<div id="root"></div>
<script>
const P=new URLSearchParams(location.search), V=P.get('view')||'phone-home';
if(P.get('theme')==='light') document.body.classList.add('light');
const I=f=>`../../public/images/${f}`;
const map=()=>`<div class="map"><i style="left:0;right:0;top:30%;height:9px"></i><i style="left:0;right:0;top:72%;height:6px"></i><i style="top:0;bottom:0;left:22%;width:7px"></i><i style="top:0;bottom:0;left:64%;width:10px"></i><i style="left:-10%;right:-10%;top:50%;height:5px;transform:rotate(-18deg)"></i><span class="pin"></span></div>`;
const T={
 img:(f,h,t,s)=>`<div class="tile"><div class="pic" style="height:${h}px"><img src="${I(f)}"></div>${t?`<div class="meta"><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div>`:''}</div>`,
 web:(f,h,t,d)=>`<div class="tile"><div class="pic" style="height:${h}px"><img src="${I(f)}"></div><span class="badge">↗ Website</span><div class="meta"><div class="t">${t}</div><div class="s">${d}</div></div></div>`,
 addr:(t,a)=>`<div class="tile">${map()}<span class="badge">● Address</span><div class="meta"><div class="t">${t}</div><div class="s">${a}</div></div></div>`,
 note:(txt,s)=>`<div class="tile"><div class="note">${txt}<div class="s dim" style="font-family:'Plus Jakarta Sans';font-size:11.5px">${s}</div></div></div>`
};
const boardItems=[
 T.img('hero-cottesloe-gate.jpg',230,'Cottesloe gate','Note · client loved the curve'),
 T.web('hero-marakesh-tall.jpg',150,'Moorish screens — courtyard ideas','archdaily.com'),
 T.note('Ask fabricator about 6mm corten for the double gate — weight on hinges?','Note · 2 days ago'),
 T.addr('Smith residence — site','14 Marine Pde, Cottesloe WA'),
 T.img('hero-creeping-fig-autumn-1.jpg',200,'Creeping fig, autumn',''),
 T.img('plume-deco-rust-1.jpg',170,'Rust patina detail',''),
 T.web('hero-homebase-dusk.jpg',130,'Gate hardware — sliding tracks','supplier site'),
 T.img('hero-gren-free.jpg',220,'',''),
 T.addr('Corten supplier','Welshpool WA'),
 T.img('hero-seaweed.jpg',160,'Seaweed pattern','Screenshot'),
];
const R=document.getElementById('root');
const status=`<div class="status"><span>9:41</span><span>●●● ▮</span></div>`;
const tabbar=`<div class="tabbar"><div class="on"><b></b>Boards</div><div><b style="border-radius:50%"></b>Search</div><div><b></b>Map</div><div><b style="border-radius:50%"></b>Settings</div></div>`;
if(V==='phone-home'){
 const B=(fs,n,c)=>`<div class="board"><div class="cover">${fs.map(f=>`<div><img src="${I(f)}"></div>`).join('')}</div><div class="n">${n}</div><div class="c">${c}</div></div>`;
 R.innerHTML=`<div class="phone">${status}<div class="ph-head"><div class="row"><span class="title">Collection</span><span class="avatar">RJ</span></div><div class="search">⌕ &nbsp;Search everything</div><div class="seg" style="margin-top:14px"><span class="on">Boards</span><span>All</span><span>Map</span></div></div>
 <div class="boards">
 ${B(['hero-cottesloe-gate.jpg','plume-deco-rust-1.jpg','hero-marakesh-tall.jpg'],'Gate ideas','24 items')}
 ${B(['hero-homebase-dusk.jpg','hero-homebase-totems.jpg','hero-vasuki.jpg'],'Smith commission','18 items')}
 ${B(['esfera-fire-burner.jpg','bon-bon.jpg','medina.jpg'],'Inspiration — light','41 items')}
 ${B(['rust-texture.jpg','concrete-texture.jpg','mowhiti.jpg'],'Materials &amp; finishes','15 items')}
 ${B(['hero-seaweed.jpg','hero-banksia-round.jpg','hero-creeping-fig-autumn-1.jpg'],'Patterns','56 items')}
 ${B(['cottesloe-concept-1.jpg','hero-rue-1.jpg','hero-gren-free.jpg'],'Suppliers &amp; places','9 items')}
 </div><div class="fab" style="bottom:104px">+</div>${tabbar}</div>`;
}
if(V==='phone-board'){
 R.innerHTML=`<div class="phone">${status}<div class="bhead"><div class="back">‹ Boards</div><div class="title">Gate ideas</div><div class="dim" style="font-size:13px;margin-top:4px">24 items · 4 links · 2 places</div><div class="seg row2"><span class="on">All</span><span>Images</span><span>Websites</span><span>Places</span><span>Notes</span></div></div>
 <div class="pane"><div class="masonry">${boardItems.join('')}</div></div><div class="fab" style="bottom:104px">+</div>${tabbar}</div>`;
}
if(V==='desktop'){
 const S=(f,n,k,on)=>`<div class="it${on?' on':''}"><img src="${I(f)}"><span>${n}</span><span class="k">${k}</span></div>`;
 const more=[T.img('esfera-fire-burner.jpg',200,'Fire bowl — night','Inspiration'),T.img('hero-vasuki.jpg',180,'',''),T.web('cottesloe-concept-1.jpg',140,'Coastal gates — case study','dezeen.com'),T.img('hero-banksia-round.jpg',210,'Banksia round',''),T.note('Gate 2: keep pattern open at eye level so the garden reads through.','Note · today')];
 R.innerHTML=`<div class="desk"><div class="side"><div class="title">Collection</div>
 <div class="it">▦ &nbsp;All items<span class="k">163</span></div><div class="it">◎ &nbsp;Map<span class="k">11</span></div>
 <div class="lab">Boards</div>
 ${S('hero-cottesloe-gate.jpg','Gate ideas',24,1)}${S('hero-homebase-dusk.jpg','Smith commission',18)}${S('esfera-fire-burner.jpg','Inspiration — light',41)}${S('rust-texture.jpg','Materials &amp; finishes',15)}${S('hero-seaweed.jpg','Patterns',56)}${S('cottesloe-concept-1.jpg','Suppliers &amp; places',9)}
 <div class="it dim">+ &nbsp;New board</div></div>
 <div class="main"><div class="mtop"><div class="search">⌕ &nbsp;Search everything — try “spiral” or “corten”</div><span style="flex:1"></span><span class="btn">+ Add</span></div>
 <div class="mtitle"><span class="title">Gate ideas</span><span class="dim">24 items</span></div>
 <div class="seg" style="margin-bottom:18px"><span class="on">All</span><span>Images</span><span>Websites</span><span>Places</span><span>Notes</span></div>
 <div class="masonry">${boardItems.concat(more).join('')}</div></div></div>`;
}
</script></body></html>
